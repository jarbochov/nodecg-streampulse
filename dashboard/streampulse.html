<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #9aa3b2; font: 13px system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100vh; display: block; }
  .msg { padding: 24px; }
</style>
</head>
<body>
<div class="msg" id="msg">Waiting for StreamPulse...</div>
<script>
  const status = nodecg.Replicant('status');
  let src = '';
  status.on('change', s => {
    const msg = document.getElementById('msg');
    if (!s || !s.running) { msg.textContent = s && s.error ? `StreamPulse is not running: ${s.error}` : 'Waiting for StreamPulse...'; return; }
    const next = `${s.protocol}://${location.hostname}:${s.publicPort}/`;
    if (next === src) return;
    src = next;
    msg.remove();
    const frame = document.querySelector('iframe') || document.body.appendChild(document.createElement('iframe'));
    frame.src = src;
  });
</script>
</body>
</html>
