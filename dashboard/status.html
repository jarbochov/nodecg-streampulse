<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; color: #e5e7eb; font: 13px system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid; }
  .ok { color: #4ade80; background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.35); }
  .bad { color: #f87171; background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.35); }
  .muted { color: #9aa3b2; word-break: break-all; }
  a { display: inline-flex; align-items: center; gap: 6px; color: #93c5fd; text-decoration: none; }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="row"><span class="badge bad" id="badge">Offline</span><span class="muted" id="detail"></span></div>
<a id="open" href="#" target="_blank" rel="noopener" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
  Open StreamPulse
</a>
<script>
  nodecg.Replicant('status').on('change', s => {
    const running = !!(s && s.running);
    const badge = document.getElementById('badge');
    badge.textContent = running ? 'Running' : 'Offline';
    badge.className = `badge ${running ? 'ok' : 'bad'}`;
    const url = running ? `${s.protocol}://${location.hostname}:${s.publicPort}/` : '';
    document.getElementById('detail').textContent = running ? url : (s && s.error) || '';
    const open = document.getElementById('open');
    open.hidden = !running;
    open.href = url || '#';
  });
</script>
</body>
</html>
